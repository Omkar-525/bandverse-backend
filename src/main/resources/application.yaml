spring:

  application:
    name: ${APP_NAME:bandverse-backend}

  jackson:
    time-zone: ${APP_TIMEZONE:Asia/Kolkata}

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:bandverse}
    username: ${DB_USERNAME:bandverse_app}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:validate}

    show-sql: ${JPA_SHOW_SQL:false}

    open-in-view: false

  flyway:
    enabled: ${FLYWAY_ENABLED:true}


server:
  port: ${SERVER_PORT:8080}


management:
  endpoints:
    web:
      exposure:
        include: health,info

  endpoint:
    health:
      probes:
        enabled: true


logging:
  level:
    root: INFO
    com.bandverse: DEBUG