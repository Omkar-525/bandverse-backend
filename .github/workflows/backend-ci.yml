name: BandVerse Backend CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  test:
    name: build & test

    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: bandverse
          POSTGRES_USER: bandverse_app
          POSTGRES_PASSWORD: bandverse_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd="pg_isready -U bandverse_app -d bandverse"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

      env:
        DB_HOST: localhost
        DB_PORT: 5433
        DB_NAME: bandverse
        DB_USERNAME: bandverse_app
        DB_PASSWORD: bandverse_test

    steps:
      - name: Checkout App
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Executing maven
        run: chmod +x mvnw

      - name: Run tests
        run: ./mvnw clean test