services:

  postgres:
    image: postgres:17
    container_name: bandverse-postgres

    restart: unless-stopped

    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}

    ports:
      - "5433:5432"

    volumes:
      - bandverse-postgres-data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bandverse_app -d bandverse"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:

  bandverse-postgres-data: